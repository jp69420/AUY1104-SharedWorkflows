name: Reusable Build and Push Template

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: "Nombre de la imagen de Docker (ej. ghcr.io/tu-usuario/tu-repo)"
      image_tag:
        required: true
        type: string
        description: "Etiqueta de la imagen (ej. el SHA del commit)"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ inputs.image_name }}:${{ inputs.image_tag }}